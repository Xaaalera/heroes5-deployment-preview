name: Verify mod sources
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    env:
      H5_TEST_PROFILE: public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Link the shared Game API
        shell: pwsh
        run: |
          $sharedApi = (Resolve-Path -LiteralPath game-api).Path
          $sdkApi = Join-Path $env:GITHUB_WORKSPACE 'devkit/game-api'
          $expectedApi = (git -C devkit rev-parse HEAD:game-api).Trim()
          $actualApi = (git -C game-api rev-parse HEAD).Trim()
          if ($expectedApi -ne $actualApi) { throw 'Game API pins differ' }
          # A relative gitfile breaks when Git enters this submodule through the SDK junction.
          $sharedGitDirectory = (git -C game-api rev-parse --absolute-git-dir)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve shared Game API Git metadata' }
          Set-Content -LiteralPath (Join-Path $sharedApi '.git') -Value "gitdir: $($sharedGitDirectory.Trim())" -Encoding utf8NoBOM -Force
          if (Test-Path -LiteralPath $sdkApi) {
            if (@(Get-ChildItem -LiteralPath $sdkApi -Force).Count -ne 0) { throw 'Expected empty SDK Game API placeholder' }
            Remove-Item -LiteralPath $sdkApi
          }
          New-Item -ItemType Junction -Path $sdkApi -Target $sharedApi | Out-Null
          git -C devkit/game-api status --porcelain --untracked-files=normal
          if ($LASTEXITCODE -ne 0) { throw 'Shared Game API junction is not a valid Git worktree' }
          git status --porcelain --untracked-files=normal
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect checkout with shared Game API junction' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - name: Build x86 Release
        shell: pwsh
        run: |
          $locator = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vcvars = (& $locator -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Auxiliary/Build/vcvarsall.bat' | Select-Object -First 1)
          if (-not $vcvars) { throw 'MSVC x86 tools not found' }
          New-Item -ItemType Directory -Path .local -Force | Out-Null
          @"
          @echo off
          call "$vcvars" x86 >nul
          if errorlevel 1 exit /b 1
          cmake -G "NMake Makefiles" -S . -B .local/build/deployment-preview-native -DCMAKE_BUILD_TYPE=Release
          if errorlevel 1 exit /b 1
          cmake --build .local/build/deployment-preview-native --config Release
          if errorlevel 1 exit /b 1
          cmake --install .local/build/deployment-preview-native --config Release --prefix .local/dist/deployment-preview-native
          if errorlevel 1 exit /b 1
          rem Legacy exports are an offline unit-test oracle, never the player package.
          cmake -G "NMake Makefiles" -S . -B .local/build/deployment-preview-legacy-oracle -DCMAKE_BUILD_TYPE=Release -DH5_PREVIEW_MANAGED_SDK=OFF
          if errorlevel 1 exit /b 1
          cmake --build .local/build/deployment-preview-legacy-oracle --config Release
          "@ | Set-Content -LiteralPath .local/ci-build.cmd -Encoding ascii
          cmd /d /c .local\ci-build.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "H5_PREVIEW_BUILD=$((Join-Path $env:GITHUB_WORKSPACE '.local/build/deployment-preview-legacy-oracle'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - name: Check pull request
        if: github.event_name == 'pull_request'
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run review:secrets -- --base ${{ github.event.pull_request.base.sha }}
      - name: Check reviewed push
        if: github.event_name == 'push'
        run: npm run review:gate
